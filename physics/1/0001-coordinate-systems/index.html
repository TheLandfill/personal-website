			<h2>Coordinate Identification</h2>
			<p>In this task, your goal is to correctly identify the coordinates
			of each point.
			</p>
			<div id="coordinate-identification-div" style="margin: auto; width: 60%">

				</canvas>

				</div>

			<h2>Plotting Coordinates</h2>
			<p>In this task, your goal is to correctly plot each point given
			each coordinate.
			</p>
			<div id="plotting-coordinates-div" style="margin: auto; width: 60%">
				<canvas id="plotting-coordinates" width="501" height="501" onclick="coordinate_select(event)">
				</canvas>

		<script>
			let id_coords = {};
			let coord_to_find = {};
			let selected_coords = {};
			function gen_random_coord() {
				return { "x": Math.floor(Math.random() * 15 - 7), "y": Math.floor(Math.random() * 15 - 7) };
			};
			function graph_to_canvas(x, y, width, height) {
				return { "x": width / 2 + width * x / 16, "y": height / 2 +
					height * y / 16 };
			};
			function draw_dot(canvas_dat, x, y, r) {
				let ctx = canvas_dat.ctx;
				let width = canvas_dat.width;
				let height = canvas_dat.height;
				ctx.beginPath();
				let cc = graph_to_canvas(x, -y, width, height);
				ctx.arc(cc.x, cc.y, r, 0, 2 * Math.PI, false);
				ctx.lineWidth = 2;
				ctx.strokeStyle = 'white';
				ctx.stroke();
				ctx.lineWidth = 4;
				ctx.strokeStyle = 'white';
				ctx.stroke();
				ctx.lineWidth = 6;
				ctx.strokeStyle = 'white';
				ctx.stroke();
				ctx.fillStyle = '#DC143C';
				ctx.fill();
				ctx.lineWidth = 2;
				ctx.strokeStyle = 'black';
				ctx.stroke();
			}
			function draw_grid(canvas_dat) {
				let ctx = canvas_dat.ctx;
				let width = canvas_dat.width;
				let height = canvas_dat.height;
				ctx.fillStyle = "white";
				ctx.fillRect(0, 0, width, height);
				ctx.beginPath();
				ctx.strokeStyle = "#777777";
				ctx.lineWidth = 1;
				for (let index = -8; index < 8; index++) {
					ctx.moveTo(width / 2 + width * index / 16, 0);
					ctx.lineTo(width / 2 + width * index / 16, height);
					ctx.stroke();
					ctx.moveTo(0, height / 2 + height * index / 16);
					ctx.lineTo(width, height / 2 + height * index / 16);
					ctx.stroke();
				}
				ctx.beginPath();
				ctx.strokeStyle = "black";
				ctx.lineWidth = 3;
				ctx.moveTo(width / 2, 0     );
				ctx.lineTo(width / 2, height);
				ctx.stroke();
				ctx.moveTo(0,     height / 2);
				ctx.lineTo(width, height / 2);
				ctx.stroke();
			}
			function adjust_canvas(canvas, canvas_div) {
				let ctx = canvas.getContext("2d");
				canvas.width = canvas_div.clientWidth;
				canvas.height = canvas.width;
				id_coords = gen_random_coord();
				let width = canvas.width;
				let height = canvas.height;
				return { 'ctx' : ctx, 'width' : width, 'height' : height };
			}
			function draw_coord_id() {
				let canvas = document.getElementById("coordinate-identification");
				let canvas_div = document.getElementById("coordinate-identification-div");
				let canvas_dat = adjust_canvas(canvas, canvas_div);
				draw_grid(canvas_dat);

				id_coords = gen_random_coord();
				console.log(id_coords);
				draw_dot(canvas_dat, id_coords.x, id_coords.y, canvas_dat.width / 64);
			};
			draw_coord_id();
			function set_coord_to_find() {
				coords_to_find = gen_random_coord();
				selected_coords = {};
				document.getElementById("coord-to-find").textContent =
					`\\((${coords_to_find.x}, ${-coords_to_find.y})\\)`;
			}
			function draw_coord_plot() {
				let canvas = document.getElementById("plotting-coordinates");
				let canvas_div = document.getElementById("plotting-coordinates-div");
				let canvas_dat = adjust_canvas(canvas, canvas_div);
				set_coord_to_find();
				console.log(coords_to_find);
				draw_grid(canvas_dat);
			}
			draw_coord_plot();
			function get_coord(e, canvas) {
				let rect = canvas.getBoundingClientRect();
				return {
					x: e.clientX - rect.left,
					y: e.clientY - rect.top
				};
			}
			function coordinate_select(e) {
				let canvas = document.getElementById("plotting-coordinates");
				let canvas_div = document.getElementById("plotting-coordinates-div");
				let canvas_dat = adjust_canvas(canvas, canvas_div);
				let canvas_coords = get_coord(e, canvas);
				selected_coords = {
					x: Math.round(canvas_coords.x * 16 / canvas_dat.width) - 8,
					y: Math.round(canvas_coords.y * 16 / canvas_dat.height) - 8,
				};
				console.log(selected_coords);
				draw_grid(canvas_dat);
				draw_dot(canvas_dat, selected_coords.x, -selected_coords.y,
					canvas_dat.width / 64);
			}
			function check_coord_id_answer(e) {
				if(event.key === 'Enter') {
					let answer =
						document.getElementById("coordinate-identification-input")
						.value.replace(/\s/g,'');
					if (answer === `(${id_coords.x},${id_coords.y})`) {
						alert("Correct!");
					} else {
						if (answer[0] != '(' || answer[answer.length - 1] != ')') {
							alert("Remember that your coordinates should always start and end with parentheses!");
						}
						alert(`The correct answer was (${id_coords.x}, ${id_coords.y}).`);
					}
					draw_coord_id();
				}
			}

					alert("Correct!");
					return;
				} else if (selected_coords.x === coord_to_find.y && selected_coords.y
					=== coord_to_find.x) {
					alert(`You mixed up the order of the coordinates. You selected the point (${selected_coords.x}, ${selected_coords.y}) instead of (${coord_to_find.x}, ${coord_to_find.y}).`);
				} else {
					alert(`You selected the point (${selected_coords.x}, ${selected_coords.y}) instead of (${coord_to_find.x}, ${coord_to_find.y}).`);
				}
			}
		</script>
